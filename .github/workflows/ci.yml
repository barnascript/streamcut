name: ci
on:
  push:
  pull_request:

jobs:
  worker:
    name: Rust worker
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: worker }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  api:
    name: TypeScript API
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Whole stack (docker compose)
    needs: [worker, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: docker compose up -d --build --wait redis scylla api worker
      - run: scripts/e2e.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
