[package]
name = "streamcut-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
redis = { version = "1.8.2", features = ["tokio-comp", "streams", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
scylla = "1.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
